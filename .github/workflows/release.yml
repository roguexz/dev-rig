name: release

# Cutting a release:
#   git tag 0.7.0 && git push origin 0.7.0
# This workflow hashes the GitHub-built archive for that tag and pushes the
# url/sha256/version bump to the tap repository (roguexz/homebrew-ldx), so
# consumers get it with 'brew upgrade roguexz/ldx/ldx'.
#
# Requires the repository secret TAP_BUMP_PAT: a fine-grained PAT scoped to
# roguexz/homebrew-ldx with Contents: Read and write.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

jobs:
  bump-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Download the release archive and compute its hash
        id: hash
        run: |
          v="${GITHUB_REF_NAME}"
          url="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${v}.tar.gz"
          sha="$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)"
          test -n "$sha"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Bump the tap formula
        env:
          GH_TOKEN: ${{ secrets.TAP_BUMP_PAT }}
          URL: ${{ steps.hash.outputs.url }}
          SHA: ${{ steps.hash.outputs.sha }}
        run: |
          v="${GITHUB_REF_NAME}"
          f="Formula/ldx.rb"
          api="repos/roguexz/homebrew-ldx/contents/$f"
          old_sha="$(gh api "$api" --jq .sha)"
          gh api "$api" --jq .content | base64 -d > "$f"
          sed -i -E \
            -e "s#^  url \"[^\"]+\"#  url \"${URL}\"#" \
            -e "s#^  sha256 \"[^\"]*\"#  sha256 \"${SHA}\"#" \
            -e "s#^  version \"[^\"]*\"#  version \"${v}\"#" \
            "$f"
          gh api -X PUT "$api" \
            -f message="ldx ${v}" \
            -f sha="$old_sha" \
            -f content="$(base64 -w0 "$f")" \
            -f branch=main \
            > /dev/null
          echo "roguexz/homebrew-ldx bumped to ldx ${v}"
