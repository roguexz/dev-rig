# cvescan configuration file
# Default path: /usr/local/etc/cvescan.conf (copied during 'dev-setup cvescan install')

# Target directories to scan for vulnerabilities
SCAN_TARGETS=("/Applications" "/Users")

# Severities to report (comma-separated: CRITICAL,HIGH,MEDIUM,LOW)
SEVERITIES="CRITICAL,HIGH"

# Log and report directory
LOG_DIR="/var/log/cvescan"

# Maximum number of scan runs to retain in history
MAX_LOG_HISTORY=3

# Number of days between mandatory full scans (bypassing fingerprint change cache)
FULL_SCAN_INTERVAL_DAYS=30

# Exclude patterns for fingerprinting and scanning to optimize performance
EXCLUDE_PATTERNS=(
  "*/Library/Caches/*"
  "*/.cache/*"
  "*/Library/Containers/*"
  "*/.docker/*"
  "*/.colima/*"
  "*/node_modules/*"
  "*/.git/*"
)
