apiVersion: v1
kind: Service
metadata:
  name: postgres-host-access
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: host-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Values.postgresql.fullnameOverride | default "postgresql" }}
    app.kubernetes.io/component: primary
  ports:
    - port: 5432
      targetPort: postgresql
      nodePort: {{ .Values.hostAccess.nodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-lb
  labels:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/component: host-access
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: postgresql
    app.kubernetes.io/instance: {{ .Values.postgresql.fullnameOverride | default "postgresql" }}
    app.kubernetes.io/component: primary
  ports:
    - port: 5432
      targetPort: postgresql
