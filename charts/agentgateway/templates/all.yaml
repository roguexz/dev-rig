apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "agentgateway.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentgateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: agentgateway
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: agentgateway
  template:
    metadata:
      labels:
        app: agentgateway
      {{- with .Values.podAnnotations }}
      annotations:
        # Config checksums (supplied by 'ldx agentgateway prepare-values').
        # The config mounts use subPath, which never picks up ConfigMap
        # updates on a running pod; hashing the CLI-owned ConfigMaps into the
        # pod template makes a config change roll the deployment.
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Ensure the SQLite volume stays writable regardless of the image uid.
        fsGroup: 1000
      containers:
      - name: agentgateway
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        securityContext:
          # Run as uid 1000 so the gateway can read the credential files
          # (perms 0400) written by the Vault Agent sidecar.
          runAsUser: 1000
        args:
        - "-f"
        - "/etc/agentgateway/config.yaml"
        envFrom:
        # Runtime credentials (OIDC cookie/client secret, oMLX API key); the
        # config file references them as $VAR and agentgateway expands them.
        - secretRef:
            name: {{ .Values.secretName }}
            optional: true
        env:
        # Extra CA certificates (mkcert CA for local services like Authelia).
        # Mounted as SSL_CERT_DIR so they're added to the system root store
        # rather than replacing it; public CAs continue to come from the image.
        - name: SSL_CERT_DIR
          value: "/etc/ssl/extra-cas"
        ports:
        - containerPort: {{ .Values.port }}
          name: http
        volumeMounts:
        - name: config
          mountPath: /etc/agentgateway/config.yaml
          subPath: config.yaml
        - name: data
          mountPath: /data
        # Shared credentials directory (written by the Vault Agent sidecar).
        - name: mcp-credentials
          mountPath: {{ .Values.mcpCredentialsDir }}
          readOnly: true
        - name: extra-cas
          mountPath: /etc/ssl/extra-cas
          readOnly: true
        # The admin port (15000) binds to the pod's loopback only, so probe
        # the gateway port instead.
        readinessProbe:
          tcpSocket:
            port: {{ .Values.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          tcpSocket:
            port: {{ .Values.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
      - name: vault-agent
        image: {{ .Values.vaultAgent.image }}
        imagePullPolicy: IfNotPresent
        securityContext:
          # Run as uid 1000 so the credential files (perms 0400) are readable
          # by the gateway container (also uid 1000).
          runAsUser: 1000
        args:
        - "agent"
        - "-config=/etc/vault-agent/config/config.hcl"
        - "-log-level=info"
        volumeMounts:
        # Vault Agent config (auto-auth + templates).
        - name: vault-agent-config
          mountPath: /etc/vault-agent/config
        # Directory for the token file sink (and any other agent state).
        - name: vault-agent-state
          mountPath: /vault-agent
        # Shared credentials directory (read-write for the agent).
        - name: mcp-credentials
          mountPath: {{ .Values.mcpCredentialsDir }}
        # The service account token (used by the kubernetes auth method).
        - name: vault-token
          mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: {{ .Values.configCMName }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "agentgateway.fullname" . }}-data
      - name: vault-agent-config
        configMap:
          name: {{ .Values.vaultAgentConfigCM }}
      # Shared emptyDir: Vault Agent writes credential files, gateway reads
      # them. fsGroup ensures the files are owned by uid 1000 (the gateway user).
      - name: mcp-credentials
        emptyDir: {}
      # emptyDir for the Vault Agent's token file and state.
      - name: vault-agent-state
        emptyDir: {}
      # Extra CA certificates (mkcert CA) as a ConfigMap, created by the
      # 'ldx k8s' preflight; added to the system root store so public CAs
      # continue to come from the container image.
      - name: extra-cas
        configMap:
          name: {{ .Values.extraCasCMName }}
      # The pod's service account token, mounted explicitly for Vault
      # Kubernetes auth (audience "vault").
      - name: vault-token
        projected:
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
              audience: vault
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "agentgateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: agentgateway
  ports:
  - port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "agentgateway.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agentgateway.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "agentgateway.fullname" . }}
            port:
              number: {{ .Values.port }}
