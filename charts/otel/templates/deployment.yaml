apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app: lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      {{- if .Values.hostAliases }}
      hostAliases:
        {{- range .Values.hostAliases }}
        - ip: {{ .ip | quote }}
          hostnames:
            {{- range .hostnames }}
            - {{ . | quote }}
            {{- end }}
        {{- end }}
      {{- end }}
      containers:
      - name: lgtm
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        # Override the default Grafana admin password (account is still created
        # for OIDC sign-up; basic login is disabled so it cannot be used).
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.adminPassword | quote }}
        # Disable anonymous access (the otel-lgtm image enables it by default).
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: "false"
        # Disable username/password login entirely. Users must sign in through
        # the configured OIDC provider (Authelia).
        - name: GF_AUTH_BASIC_ENABLED
          value: "false"
        # Use our custom grafana.ini (overrides the baked-in one in the image).
        - name: GF_PATHS_CONFIG
          value: "/etc/grafana/grafana.ini"
        # Grafana's external URL (used for redirect URIs, links, etc.)
        - name: GF_SERVER_ROOT_URL
          value: "https://{{ .Values.ingress.host }}/"
        {{- if .Values.extraCAs.enabled }}
        # Extra CA certificates (mkcert CA for local services like Authelia).
        # Mounted as SSL_CERT_DIR so they're added to the system root store.
        - name: SSL_CERT_DIR
          value: "/etc/ssl/extra-cas"
        {{- end }}
        {{- if .Values.oidc.enabled }}
        # Authelia OIDC SSO
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: "Authelia"
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: "true"
        # New users (created via any auth method) get the Editor role by default.
        - name: GF_USERS_AUTO_ASSIGN_ORG_ROLE
          value: "Editor"
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: {{ .Values.oidc.clientId | quote }}
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: OAUTH_CLIENT_SECRET
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: "openid profile email groups"
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: "https://{{ .Values.oidc.issuerHost }}/api/oidc/authorization"
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: "https://{{ .Values.oidc.issuerHost }}/api/oidc/token"
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: "https://{{ .Values.oidc.issuerHost }}/api/oidc/userinfo"
        {{- end }}
        ports:
        - containerPort: 3000
          name: grafana
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        volumeMounts:
        # Custom Grafana config (overrides the baked-in one in the otel-lgtm image).
        - name: grafana-config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
          readOnly: true
        {{- if .Values.extraCAs.enabled }}
        # Extra CA certificates (mkcert CA) mounted as a directory for SSL_CERT_DIR.
        - name: extra-cas
          mountPath: /etc/ssl/extra-cas
          readOnly: true
        {{- end }}
      volumes:
      - name: grafana-config
        configMap:
          name: grafana-config
      {{- if .Values.extraCAs.enabled }}
      - name: extra-cas
        configMap:
          name: extra-cas
      {{- end }}
