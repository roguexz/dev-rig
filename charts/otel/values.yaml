# Grafana OTel LGTM all-in-one image (Loki, Grafana, Tempo, Mimir, collector).
# The actual image is provided by the ldx CLI from config/images.yaml; these
# are fallback values for standalone chart deployment.
image:
  repository: grafana/otel-lgtm
  tag: "0.41.0"
  pullPolicy: Always

# Grafana admin account password. Standalone-chart fallback: 'ldx k8s up
# --services otel' generates a random per-install password, stores it in the
# host secret store, and sets adminPasswordSecret so the value never enters
# values. (Basic login is disabled when OIDC is on; the account exists for
# OIDC sign-up.)
adminPassword: changeit
# Name of an existing Secret holding the admin password (key admin-password);
# takes precedence over adminPassword when set.
adminPasswordSecret: ""

ingress:
  className: traefik
  host: otel.rd.localhost

# Extra CA volume: the 'extra-cas' ConfigMap is created by the ldx CLI
# (shared with other services), the deployment only mounts it.
extraCAs:
  enabled: true

# Custom hostname-to-IP mappings for the pod (PodSpec.hostAliases). Set by
# 'ldx k8s up' or 'ldx otel sso enable' to point auth.rd.localhost at the
# Traefik ClusterIP so Grafana can reach Authelia through Traefik from inside
# the cluster.
hostAliases: []

# Authelia OIDC SSO for Grafana. 'ldx k8s up' enables this when Authelia is
# running and the GRAFANA_CLIENT_SECRET exists in the host secret store.
oidc:
  enabled: false
  clientSecret: ""
  clientId: grafana
  issuerHost: auth.rd.localhost
  autheliaNamespace: authelia
  autheliaPort: 9091

otlp:
  grpcNodePort: null
  httpNodePort: null
