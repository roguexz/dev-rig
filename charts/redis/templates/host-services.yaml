apiVersion: v1
kind: Service
metadata:
  name: redis-host-access
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: host-access
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Values.redis.fullnameOverride | default "redis" }}
    app.kubernetes.io/component: master
  ports:
    - port: 6379
      targetPort: redis
      nodePort: {{ .Values.hostAccess.nodePort }}
---
apiVersion: v1
kind: Service
metadata:
  name: redis-lb
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/component: host-access
spec:
  type: LoadBalancer
  selector:
    app.kubernetes.io/name: redis
    app.kubernetes.io/instance: {{ .Values.redis.fullnameOverride | default "redis" }}
    app.kubernetes.io/component: master
  ports:
    - port: 6379
      targetPort: redis
