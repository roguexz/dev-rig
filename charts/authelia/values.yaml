# Authelia for the local rig. Secrets and password hashes are NOT stored in
# git: the ldx CLI supplies them at apply time from the host secret store
# (Keychain) via a temp values file (prehook in bin/commands/ldx-k8s).
nameOverride: authelia

# The umbrella release lives in 'commons'; Authelia keeps its own namespace.
namespaceOverride: authelia

image: docker.io/authelia/authelia:latest
host: auth.rd.localhost
port: 9091

storage:
  size: 1Gi

# Core secrets (Secret authelia-secrets). Populated by 'ldx k8s' from
# ldx/authelia_core/*; empty values keep the Secret shape for helm diffing.
secrets:
  JWT_SECRET: ""
  STORAGE_KEY: ""
  SESSION_SECRET: ""
  OIDC_HMAC_SECRET: ""

config:
  # users_database.yml admin password (Argon2id hash, from
  # ldx/authelia_core/BOOTSTRAP_PASSWORD_HASH).
  passwordHash: ""
  # OIDC provider JWKS private key (PEM, from ldx/authelia/jwks_pkcs8).
  jwksKey: ""
  # Pre-hashed (PBKDF2) OIDC client secrets for the configured clients.
  clients:
    vault:
      secretHash: ""
    agentgateway:
      secretHash: ""
    grafana:
      secretHash: ""

# Traefik service annotations for TLS re-encryption. The CLI sets
# serversTransport (mkcert CA) when the CRD exists, else serversslVerify.
serviceAnnotations: {}

certificate:
  issuer: mkcert-issuer
