apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "authelia.fullname" . }}-data
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "authelia.fullname" . }}-cert
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
spec:
  secretName: {{ include "authelia.fullname" . }}-cert
  dnsNames:
    - {{ .Values.host }}
    - {{ include "authelia.fullname" . }}.{{ include "authelia.namespace" . }}.svc.cluster.local
    - {{ include "authelia.fullname" . }}
  issuerRef:
    name: {{ .Values.certificate.issuer }}
    kind: ClusterIssuer
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "authelia.fullname" . }}-secrets
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.JWT_SECRET | quote }}
  STORAGE_KEY: {{ .Values.secrets.STORAGE_KEY | quote }}
  SESSION_SECRET: {{ .Values.secrets.SESSION_SECRET | quote }}
  OIDC_HMAC_SECRET: {{ .Values.secrets.OIDC_HMAC_SECRET | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "authelia.fullname" . }}
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate  # Required for SQLite lock safety
  selector:
    matchLabels:
      {{- include "authelia.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Rolling-restart trigger: the config/secret are mounted as files, so
        # a values change must create new pods (subPath mounts do not reload).
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
      labels:
        {{- include "authelia.selectorLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: false  # Prevents env variable naming conflicts
      containers:
        - name: authelia
          image: {{ .Values.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: https
              containerPort: {{ .Values.port }}
              protocol: TCP
          env:
            - name: AUTHELIA_JWT_SECRET_FILE
              value: "/config/secrets/JWT_SECRET"
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: "/config/secrets/STORAGE_KEY"
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: "/config/secrets/SESSION_SECRET"
            - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
              value: "/config/secrets/OIDC_HMAC_SECRET"
          volumeMounts:
            - name: config
              mountPath: /config/configuration.yml
              subPath: configuration.yml
            - name: users
              mountPath: /config/users/users_database.yml
              subPath: users_database.yml
            - name: secrets
              mountPath: /config/secrets
            - name: data
              mountPath: /data
            - name: tls
              mountPath: /config/tls
              readOnly: true
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget --no-check-certificate -qO- https://127.0.0.1:{{ .Values.port }}/api/health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - wget --no-check-certificate -qO- https://127.0.0.1:{{ .Values.port }}/api/health
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ include "authelia.fullname" . }}-config
        - name: users
          configMap:
            name: {{ include "authelia.fullname" . }}-users
        - name: secrets
          secret:
            secretName: {{ include "authelia.fullname" . }}-secrets
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "authelia.fullname" . }}-data
        - name: tls
          secret:
            secretName: {{ include "authelia.fullname" . }}-cert
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "authelia.fullname" . }}
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
  {{- with .Values.serviceAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: https
      port: {{ .Values.port }}
      targetPort: https
  selector:
    {{- include "authelia.selectorLabels" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "authelia.fullname" . }}
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: {{ .Values.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "authelia.fullname" . }}
                port:
                  number: {{ .Values.port }}
