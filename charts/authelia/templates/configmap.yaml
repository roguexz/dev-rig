apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authelia.fullname" . }}-users
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
data:
  users_database.yml: |
    users:
      admin:
        disabled: false
        displayname: "Cluster Admin"
        password: "{{ .Values.config.passwordHash }}"
        email: "admin@rd.localhost"
        groups:
          - admins
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "authelia.fullname" . }}-config
  namespace: {{ include "authelia.namespace" . }}
  labels:
    {{- include "authelia.labels" . | nindent 4 }}
data:
  configuration.yml: |
    theme: 'dark'

    server:
      address: 'tcp://:{{ .Values.port }}/'
      tls:
        key: '/config/tls/tls.key'
        certificate: '/config/tls/tls.crt'
      buffers:
        read: 4096
        write: 4096
      endpoints:
        enable_pprof: false
        enable_expvars: false

    log:
      level: 'info'
      format: 'text'

    webauthn:
      disable: false
      display_name: 'Local K8s Cluster'
      enable_passkey_login: true

    authentication_backend:
      file:
        path: '/config/users/users_database.yml'
        watch: true

    session:
      cookies:
        - domain: 'rd.localhost'
          authelia_url: 'https://{{ .Values.host }}/'
          same_site: 'lax'
          inactivity: '1h'
          expiration: '1h'
          remember_me: '1M'
        - domain: 'cluster.local'
          authelia_url: 'https://{{ include "authelia.fullname" . }}.{{ include "authelia.namespace" . }}.svc.cluster.local/'
          same_site: 'lax'
          inactivity: '1h'
          expiration: '1h'
          remember_me: '1M'

    regulation:
      max_retries: 5
      find_time: '2m'
      ban_time: '5m'

    storage:
      local:
        path: '/data/db.sqlite3'

    notifier:
      filesystem:
        filename: '/data/notification.txt'

    access_control:
      default_policy: 'two_factor'
      rules:
        - domain: ['{{ .Values.host }}']
          policy: 'bypass'
        - domain: ['vault.rd.localhost']
          policy: 'two_factor'
        - domain: ['agentgateway.rd.localhost']
          policy: 'two_factor'
        - domain: ['otel.rd.localhost']
          policy: 'two_factor'

    identity_providers:
      oidc:
        enforce_pkce: 'public_clients_only'
        cors:
          endpoints:
            - 'authorization'
            - 'token'
            - 'revocation'
            - 'introspection'
          allowed_origins_from_client_redirect_uris: true
        jwks:
          - key_id: 'local-k8s-key'
            algorithm: 'RS256'
            use: 'sig'
            key: |
              {{- .Values.config.jwksKey | nindent 14 }}
        clients:
          - client_id: 'vault'
            client_name: 'HashiCorp Vault'
            client_secret: '{{ .Values.config.clients.vault.secretHash }}'
            public: false
            authorization_policy: 'one_factor'
            redirect_uris:
              - 'https://vault.rd.localhost/ui/vault/auth/oidc/oidc/callback'
              - 'http://localhost:8250/oidc/callback'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'

          - client_id: 'agentgateway'
            client_name: 'agentgateway'
            client_secret: '{{ .Values.config.clients.agentgateway.secretHash }}'
            public: false
            authorization_policy: 'one_factor'
            redirect_uris:
              - 'https://agentgateway.rd.localhost/oauth/callback'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'

          - client_id: 'grafana'
            client_name: 'Grafana'
            client_secret: '{{ .Values.config.clients.grafana.secretHash }}'
            public: false
            authorization_policy: 'one_factor'
            redirect_uris:
              - 'https://otel.rd.localhost/login/generic_oauth'
            scopes:
              - 'openid'
              - 'profile'
              - 'email'
              - 'groups'
