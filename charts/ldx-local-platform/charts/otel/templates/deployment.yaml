apiVersion: apps/v1
kind: Deployment
metadata:
  name: lgtm
  labels:
    app: lgtm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lgtm
  template:
    metadata:
      labels:
        app: lgtm
    spec:
      containers:
      - name: lgtm
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        env:
        # Override the default Grafana admin password
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.adminPassword | quote }}
        {{- if .Values.extraCAs.enabled }}
        # Extra CA certificates (mkcert CA for local services like Authelia).
        # Mounted as SSL_CERT_DIR so they're added to the system root store.
        - name: SSL_CERT_DIR
          value: "/etc/ssl/extra-cas"
        {{- end }}
        {{- if .Values.oidc.enabled }}
        # Authelia OIDC SSO
        - name: GF_AUTH_GENERIC_OAUTH_ENABLED
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_NAME
          value: "Authelia"
        - name: GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP
          value: "true"
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
          value: {{ .Values.oidc.clientId | quote }}
        - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: grafana-secrets
              key: OAUTH_CLIENT_SECRET
        - name: GF_AUTH_GENERIC_OAUTH_SCOPES
          value: "openid profile email groups"
        - name: GF_AUTH_GENERIC_OAUTH_AUTH_URL
          value: "https://{{ .Values.oidc.issuerHost }}/api/oidc/authorization"
        - name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL
          value: "https://authelia.{{ .Values.oidc.autheliaNamespace }}.svc.cluster.local:{{ .Values.oidc.autheliaPort }}/api/oidc/token"
        - name: GF_AUTH_GENERIC_OAUTH_API_URL
          value: "https://authelia.{{ .Values.oidc.autheliaNamespace }}.svc.cluster.local:{{ .Values.oidc.autheliaPort }}/api/oidc/userinfo"
        {{- end }}
        ports:
        - containerPort: 3000
          name: grafana
        - containerPort: 4317
          name: otlp-grpc
        - containerPort: 4318
          name: otlp-http
        {{- if .Values.extraCAs.enabled }}
        volumeMounts:
        # Extra CA certificates (mkcert CA) mounted as a directory for SSL_CERT_DIR.
        - name: extra-cas
          mountPath: /etc/ssl/extra-cas
          readOnly: true
        {{- end }}
      {{- if .Values.extraCAs.enabled }}
      volumes:
      - name: extra-cas
        configMap:
          name: extra-cas
      {{- end }}
