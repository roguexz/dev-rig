# Default values for ldx-local-platform.
#
# Enable services with 'ldx k8s up --services <name, name>' (helm --set of the
# .enabled flags below); helm persists them across upgrades, so re-running
# without --services keeps the current set.
#
# hostAccess exposes each service on the host through Rancher Desktop:
# a NodePort (nodePort) and a LoadBalancer (localhost).

redisStack:
  enabled: false
  redis:
    # Matches the pre-chart 'ldx redis install' resource names, so existing
    # clusters keep their names and PVCs on upgrade.
    fullnameOverride: redis
    architecture: standalone
    auth:
      enabled: false
  hostAccess:
    nodePort: 30379

postgresqlStack:
  enabled: false
  postgresql:
    fullnameOverride: postgresql
    architecture: standalone
    global:
      security:
        allowInsecureImages: true
    auth:
      postgresPassword: changeit
    image:
      registry: ""
      repository: local/bitnami-postgresql-pgvector
      tag: "18"
      pullPolicy: IfNotPresent
    primary:
      initdb:
        scripts:
          init-pgvector.sql: |
            -- Enable pgvector on template1 so any new database created inherits it
            \connect template1
            CREATE EXTENSION IF NOT EXISTS vector;
            -- Also enable it on the default postgres database
            \connect postgres
            CREATE EXTENSION IF NOT EXISTS vector;
  hostAccess:
    nodePort: 30432
