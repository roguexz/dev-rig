apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "bifrost.fullname" . }}-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "bifrost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: bifrost
    {{- include "bifrost.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bifrost
  template:
    metadata:
      labels:
        app: bifrost
      {{- with .Values.podAnnotations }}
      annotations:
        # Config checksums (supplied by 'ldx bifrost prepare-values').
        # The config mounts use subPath, which never picks up ConfigMap
        # updates on a running pod; hashing the CLI-owned ConfigMap into the
        # pod template makes a config change roll the deployment.
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount }}
      {{- with .Values.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        # Ensure the SQLite volume stays writable regardless of the image uid.
        fsGroup: 1000
      containers:
      - name: bifrost
        image: {{ .Values.image }}
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 1000
        envFrom:
        # Runtime credentials (admin username/password, oMLX API key,
        # virtual client key, encryption key); the config file references
        # them as env.VAR and bifrost expands them.
        - secretRef:
            name: {{ .Values.secretName }}
            optional: true
        env:
        # Extra CA certificates (mkcert CA for local services).
        # Mounted as SSL_CERT_DIR so they're added to the system root store
        # rather than replacing it; public CAs continue to come from the image.
        - name: SSL_CERT_DIR
          value: "/etc/ssl/extra-cas"
        ports:
        - containerPort: {{ .Values.port }}
          name: http
        volumeMounts:
        - name: config
          mountPath: /app/data/config.json
          subPath: config.json
        - name: data
          mountPath: /data
        - name: extra-cas
          mountPath: /etc/ssl/extra-cas
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health
            port: {{ .Values.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: {{ .Values.port }}
          initialDelaySeconds: 15
          periodSeconds: 10
      volumes:
      - name: config
        configMap:
          name: {{ .Values.configCMName }}
      - name: data
        persistentVolumeClaim:
          claimName: {{ include "bifrost.fullname" . }}-data
      # Extra CA certificates (mkcert CA) as a ConfigMap, created by the
      # 'ldx k8s' preflight; added to the system root store so public CAs
      # continue to come from the container image.
      - name: extra-cas
        configMap:
          name: {{ .Values.extraCasCMName }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bifrost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: bifrost
  ports:
  - port: {{ .Values.port }}
    targetPort: {{ .Values.port }}
    name: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bifrost.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bifrost.labels" . | nindent 4 }}
spec:
  ingressClassName: traefik
  rules:
  - host: {{ .Values.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "bifrost.fullname" . }}
            port:
              number: {{ .Values.port }}
