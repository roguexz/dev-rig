apiVersion: v2
name: ldx-cert-manager
description: >-
  cert-manager with the mkcert CA wired in: local ClusterIssuer, cluster-wide
  CA distribution (ClusterTrustBundle/TrustBundle), and Traefik TrustBundle CA
  distribution. Lives in its own release because it spans the cert-manager and
  kube-system namespaces and cluster-scoped resources.
type: application
version: 0.1.0
appVersion: "1.21.3"
keywords:
  - cert-manager
  - mkcert
  - traefik

dependencies:
  - name: cert-manager
    alias: certmanager
    version: "1.21.3"
    repository: "https://charts.jetstack.io"
