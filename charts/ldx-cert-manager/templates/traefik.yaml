{{- if .Values.ca.cert }}
# Traefik's ServersTransport references secrets in its own namespace, and
# expects the CA under the 'ca.crt' key.
apiVersion: v1
kind: Secret
metadata:
  name: mkcert-ca-bundle
  namespace: {{ .Values.traefik.namespace }}
type: Opaque
data:
  ca.crt: {{ .Values.ca.cert | b64enc | quote }}
---
{{- if .Capabilities.APIVersions.Has "traefik.io/v1alpha1/ServersTransport" }}
# Traefik ServersTransport: TLS transport for backend connections. Referenced
# by Service annotations:
#   traefik.ingress.kubernetes.io/service.serverstransport: {{ .Values.traefik.namespace }}-mkcert-ca@kubernetescrd
#
# Note: insecureSkipVerify is required because the rootCAsSecrets field (used
# to provide the CA) does not enable verification in this Traefik version.
# Connections are still encrypted (HTTPS), just not verified.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: mkcert-ca
  namespace: {{ .Values.traefik.namespace }}
spec:
  insecureSkipVerify: true
  rootCAsSecrets:
    - mkcert-ca-bundle
{{- end }}
{{- end }}
