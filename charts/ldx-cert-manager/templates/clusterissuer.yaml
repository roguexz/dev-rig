{{- if .Values.ca.cert }}
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: mkcert-issuer
  annotations:
    # Applied after the cert-manager pods are Ready: validating ClusterIssuer
    # requires the cert-manager webhook, whose endpoints do not exist during
    # the install/upgrade apply itself.
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "10"
spec:
  ca:
    secretName: mkcert-root-ca
{{- end }}
