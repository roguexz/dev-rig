# Vault Helm values for the local dev rig.
#
# This chart (0.34.1 → Vault 2.0.4) hard-codes required pod anti-affinity on
# hostname for the agent injector. On Rancher Desktop a rolling update can then
# never place its surge pod, so `helm upgrade --wait` dies with "Progress
# deadline exceeded". Surge 0 / unavailable 1 makes the old pod leave before
# the new one schedules, which is what a single node needs.
server:
  dev:
    enabled: false
  ha:
    enabled: false
  standalone:
    enabled: true
  dataStorage:
    size: 1Gi
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - host: vault.rd.localhost
        paths:
          - /
    tls:
      - secretName: default-tls-secret
        hosts:
          - vault.rd.localhost
# Clear the injector's anti-affinity and adjust its rollout strategy for
# single-node clusters (see comment above).
injector:
  affinity: {}
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
